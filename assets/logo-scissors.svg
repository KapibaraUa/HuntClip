<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Dark Slate Base -->
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#090C12"/>
    </linearGradient>

    <!-- Top Blade Gradient (Indigo to Cyan) -->
    <linearGradient id="sc-blade-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Bottom Blade Gradient (Purple to Rose) -->
    <linearGradient id="sc-blade-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <filter id="sc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#sc-bg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3"/>

  <!-- Scanning Circular Reticle Grid -->
  <circle cx="256" cy="256" r="170" stroke="rgba(255, 255, 255, 0.04)" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" stroke="rgba(99, 102, 241, 0.2)" stroke-width="2" stroke-dasharray="12 6"/>
  <circle cx="256" cy="256" r="70" stroke="rgba(6, 182, 212, 0.15)" stroke-width="1.5"/>

  <!-- Corner Crosshair Brackets -->
  <path d="M120 160 L120 120 L160 120" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
  <path d="M392 160 L392 120 L352 120" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 352 L120 392 L160 392" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
  <path d="M392 352 L392 392 L352 392" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>

  <!-- Center Cutting Blades & Play Glyph -->
  <!-- Top Cutting Shard -->
  <path d="M168 152 L328 244 L256 256 L168 206 Z" fill="url(#sc-blade-top)" filter="url(#sc-glow)"/>
  <path d="M168 152 L328 244 L256 256 L168 206 Z" fill="url(#sc-blade-top)"/>

  <!-- Bottom Cutting Shard -->
  <path d="M168 360 L328 268 L256 256 L168 306 Z" fill="url(#sc-blade-bottom)" filter="url(#sc-glow)"/>
  <path d="M168 360 L328 268 L256 256 L168 306 Z" fill="url(#sc-blade-bottom)"/>

  <!-- Central Precision Cut Laser Beam -->
  <line x1="256" y1="130" x2="256" y2="382" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="130" y1="256" x2="382" y2="256" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Focal Point Spark -->
  <circle cx="340" cy="256" r="16" fill="#06B6D4" opacity="0.3" filter="url(#sc-glow)"/>
  <circle cx="340" cy="256" r="10" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="340" cy="256" r="4" fill="#FFFFFF"/>
</svg>