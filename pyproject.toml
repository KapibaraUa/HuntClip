[project]
name = "cliphunter"
version = "0.1.0"
description = "ClipHunter: Gemini watches a stream and finds the best moments to cut into clips."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "fastapi>=0.111",
  "google-genai>=1.0",
  "greenlet>=3.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "sse-starlette>=2.1",
  "tenacity>=8.3",
  "uvicorn[standard]>=0.30",
  "yt-dlp>=2024.8",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
  "httpx>=0.27",
  "pytest-asyncio>=1.4.0",
]

[project.scripts]
cliphunter = "cliphunter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cliphunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = ["live: calls the real Gemini API (needs RUN_LIVE=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # E501: long Russian strings, B008: FastAPI Depends()

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true
